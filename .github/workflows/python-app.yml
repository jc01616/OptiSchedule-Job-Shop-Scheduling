
name: OptiSchedule Project Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r opti_schedule/requirements.txt

      - name: Validate example
        working-directory: opti_schedule
        run: python -B validate_example.py

      - name: Run scheduling model
        working-directory: opti_schedule
        run: python -B main.py

      - name: Run audit
        working-directory: opti_schedule
        run: python -B audit_runner.py
